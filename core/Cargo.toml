[package]
name = "edusvg-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "edusvg_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "edusvg"
path = "src/cli.rs"

[dependencies]
roxmltree = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
